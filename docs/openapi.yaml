openapi: 3.1.0
info:
  title: NETRA LLM Gateway API
  description: |
    **NETRA** (*Sanskrit: नेत्र — Vision / Aperture / Insight*) is a high-throughput, ultra-low latency
    intelligent LLM Gateway and tenant-isolated Semantic Vector Cache.
    
    ### Core Capabilities
    - **OpenAI-Compatible Ingress**: Direct drop-in proxy at `/v1/chat/completions`.
    - **Telemetry Contract**: Every response strictly carries canonical `x-netra-*` headers.
    - **Micro-USD Precision**: Exact 6-decimal cost calculation and quota accounting.
    - **High-Throughput Streaming**: Non-blocking SSE pass-through over Java 25 Virtual Threads.
    - **Atomic Redis 8.0 Admission**: Sliding-window rate limiting & zero over-admission budget accounting.
    - **Semantic Vector Cache**: In-JVM dense embeddings (384-dim) with pgvector HNSW indexing and per-tenant isolation.
    - **React 19 / Vite 6 Ops Console**: Real-time OpenRouter-grade analytics, prompt playground, and virtual keys management.
  version: 0.6.0
  contact:
    name: Shashank Chandel
    email: shashakchandel@gmail.com
    url: https://github.com/shashankch/netra-llmgateway
  license:
    name: Apache-2.0
    url: https://github.com/shashankch/netra-llmgateway/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local Gateway (Docker & Development)
  - url: https://shashankch.github.io/netra-llmgateway
    description: Documentation & Schema Reference (GitHub Pages)

security:
  - BearerAuth: []

paths:
  /v1/chat/completions:
    post:
      summary: Create Chat Completion
      description: |
        Processes chat completion requests with virtual key authentication, model allowlist enforcement,
        semantic vector cache lookup, dynamic failover, and micro-USD telemetry header injection.
      operationId: createChatCompletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: "fast"
              messages:
                - role: "user"
                  content: "What is an event-driven architecture?"
              temperature: 0.7
              max_tokens: 150
              stream: false
      responses:
        '200':
          description: Successful chat completion or streaming SSE event pump.
          headers:
            x-netra-provider:
              description: Upstream provider and concrete model that served the request (e.g. `alpha/alpha-small`).
              schema:
                type: string
                example: "alpha/alpha-small"
            x-netra-cache:
              description: Semantic vector cache lookup status (`hit` or `miss`).
              schema:
                type: string
                enum: [hit, miss]
                example: "miss"
            x-netra-fallback:
              description: Indicates whether secondary fallback model was invoked due to primary upstream failure.
              schema:
                type: string
                enum: ["true", "false"]
                example: "false"
            x-netra-cost-usd:
              description: Exact cost in USD calculated with 6 decimal places ($0.000000). Omitted on streaming requests until reconciled.
              schema:
                type: string
                example: "0.000015"
            x-netra-route-reason:
              description: Routing policy reasoning (e.g. `alias_direct`, `auto:complexity_simple`, `fallback_retry`).
              schema:
                type: string
                example: "alias_direct"
            x-netra-retries:
              description: Number of upstream network retries executed.
              schema:
                type: integer
                example: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: Real-time Server-Sent Events (SSE) data stream ending with `data: [DONE]`.
        '400':
          description: Invalid request payload, malformed JSON, or empty messages array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or deactivated virtual API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Monthly budget cap exhausted for this virtual key (`budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Model not permitted for this tenant (`model_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested model alias or concrete model not found in catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (sliding-window RPM exhaustion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream foundation model provider failure or network timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal gateway unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/usage:
    get:
      summary: Usage Summary & Reconciliation API
      description: |
        Returns aggregated spend and token usage for a virtual key over a date window.
        Guarantees exact reconciliation with client-side load test totals.
      operationId: getUsageSummary
      security:
        - AdminBearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          description: Virtual key to filter usage for.
          schema:
            type: string
            example: "netra-sk-search-1a2b3c"
        - name: from
          in: query
          required: false
          description: Start date (YYYY-MM-DD format). Defaults to beginning of current month.
          schema:
            type: string
            example: "2026-10-01"
        - name: to
          in: query
          required: false
          description: End date (YYYY-MM-DD format). Defaults to current date.
          schema:
            type: string
            example: "2026-10-24"
      responses:
        '200':
          description: Aggregated token counts, spend in USD, and cache hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummaryResponse'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/logs:
    get:
      summary: Audit & Request Logs API
      description: |
        Returns chronological request log entries, newest first, filterable by virtual key.
        Includes all rejections (401, 403, 404, 429, 402, 502) and successful calls.
      operationId: getRequestLogs
      security:
        - AdminBearerAuth: []
      parameters:
        - name: key
          in: query
          required: false
          description: Optional virtual key filter.
          schema:
            type: string
            example: "netra-sk-search-1a2b3c"
        - name: limit
          in: query
          required: false
          description: Maximum number of recent log entries to return (default 50, max 500).
          schema:
            type: integer
            default: 50
            example: 20
      responses:
        '200':
          description: Array of request log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestLogEntry'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/cache/stats:
    get:
      summary: Semantic Vector Cache Statistics
      description: Returns aggregate cache hit rates, entry counts, and per-tenant cryptographic isolation breakdowns.
      operationId: getCacheStats
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Aggregate cache statistics and per-key breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/keys:
    get:
      summary: List Virtual API Keys
      description: Returns all provisioned virtual keys with live RPM quotas, monthly budget caps, spend, and status.
      operationId: listVirtualKeys
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: List of all provisioned virtual keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantAdminResponse'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Provision Virtual API Key
      description: Creates a new virtual API key with sliding RPM limit, budget cap, model allowlist, and similarity threshold.
      operationId: createVirtualKey
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Virtual key successfully provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminResponse'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/keys/{id}:
    put:
      summary: Update Virtual API Key
      description: Updates virtual key rate limits, budget caps, allowlists, or active status.
      operationId: updateVirtualKey
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Virtual key updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminResponse'
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Revoke Virtual API Key
      description: Deactivates virtual API key; subsequent requests return HTTP 401.
      operationId: revokeVirtualKey
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Virtual key revoked successfully.
        '401':
          description: Unauthorized admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/logs/stream:
    get:
      summary: Live SSE Request Logs Stream
      description: Real-time Server-Sent Events stream of incoming request audit logs and rejections.
      operationId: streamRequestLogs
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: SSE stream of incoming audit logs.
          content:
            text/event-stream:
              schema:
                type: string

  /admin/currency/rate:
    get:
      summary: Live Forex Rate
      description: Returns active USD to INR exchange rate with dynamic fallback.
      operationId: getCurrencyRate
      security: []
      responses:
        '200':
          description: Current exchange rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRateResponse'

  /health:
    get:
      summary: Liveness & Readiness Health Probe
      description: Returns gateway operating status, service identity, and release version.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Gateway is healthy and accepting traffic.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - version
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "netra-gateway"
                  version:
                    type: string
                    example: "0.2.0"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Virtual Key (`netra-sk-*`)
      description: Provide tenant virtual API key in the `Authorization: Bearer <key>` header.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Admin Token
      description: Provide platform admin secret in the `Authorization: Bearer <admin-token>` header.

  schemas:
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, function]
          example: "user"
        content:
          type: string
          example: "Explain CAP theorem in one sentence."

    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Target model alias (`fast`, `smart`, `auto`) or concrete provider model (`alpha-small`, `beta-large`).
          example: "fast"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
          description: If true, emits streaming Server-Sent Events (SSE).
        temperature:
          type: number
          format: float
          default: 1.0
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          minimum: 1
          description: Maximum number of tokens to generate.

    UsageInfo:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          example: 12
        completion_tokens:
          type: integer
          example: 48
        total_tokens:
          type: integer
          example: 60

    Choice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          example: 0
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
          enum: [stop, length, content_filter, tool_calls]
          example: "stop"

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          example: "chatcmpl-9x1a2b3c4d5e"
        object:
          type: string
          example: "chat.completion"
        created:
          type: integer
          format: int64
          example: 1729732000
        model:
          type: string
          example: "alpha-small"
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        usage:
          $ref: '#/components/schemas/UsageInfo'

    ErrorDetail:
      type: object
      required:
        - message
        - type
        - code
      properties:
        message:
          type: string
          example: "Virtual API key is deactivated"
        type:
          type: string
          example: "authentication_error"
        code:
          type: string
          example: "invalid_api_key"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    UsageSummaryResponse:
      type: object
      required:
        - key
        - from
        - to
        - requests
        - prompt_tokens
        - completion_tokens
        - cost_usd
        - cache_hits
      properties:
        key:
          type: string
          example: "netra-sk-search-1a2b3c"
        from:
          type: string
          example: "2026-10-01"
        to:
          type: string
          example: "2026-10-24"
        requests:
          type: integer
          example: 412
        prompt_tokens:
          type: integer
          example: 18734
        completion_tokens:
          type: integer
          example: 9211
        cost_usd:
          type: number
          format: double
          example: 0.014100
        cache_hits:
          type: integer
          example: 96

    RequestLogEntry:
      type: object
      required:
        - id
        - request_id
        - virtual_key
        - requested_model
        - status
        - status_code
        - prompt_tokens
        - completion_tokens
        - cost_usd
        - cache
        - fallback
        - retries
        - latency_ms
        - is_stream
        - created_at
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          example: "req_1a2b3c4d5e6f"
        virtual_key:
          type: string
          example: "netra-sk-search-1a2b3c"
        requested_model:
          type: string
          example: "fast"
        resolved_provider:
          type: string
          nullable: true
          example: "alpha"
        resolved_model:
          type: string
          nullable: true
          example: "alpha-small"
        status:
          type: string
          example: "ok"
        status_code:
          type: integer
          example: 200
        prompt_tokens:
          type: integer
          example: 12
        completion_tokens:
          type: integer
          example: 48
        cost_usd:
          type: number
          format: double
          example: 0.000015
        cache:
          type: string
          example: "miss"
        fallback:
          type: boolean
          example: false
        route_reason:
          type: string
          nullable: true
          example: "alias_direct"
        retries:
          type: integer
          example: 0
        latency_ms:
          type: integer
          example: 32
        is_stream:
          type: boolean
          example: false
        error_type:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-10-24T15:00:00Z"

    CacheStatsResponse:
      type: object
      required:
        - total_entries
        - total_hits
        - total_misses
        - hit_rate
        - keys
      properties:
        total_entries:
          type: integer
          example: 150
        total_hits:
          type: integer
          example: 120
        total_misses:
          type: integer
          example: 30
        hit_rate:
          type: number
          format: double
          example: 0.80
        keys:
          type: object
          additionalProperties:
            type: object
            required:
              - entries
              - hits
              - misses
              - hit_rate
            properties:
              entries:
                type: integer
                example: 150
              hits:
                type: integer
                example: 120
              misses:
                type: integer
                example: 30
              hit_rate:
                type: number
                format: double
                example: 0.80

    TenantAdminResponse:
      type: object
      required:
        - id
        - virtual_key
        - team
        - monthly_budget_usd
        - current_spend_usd
        - rpm_limit
        - model_allowlist
        - semantic_cache_enabled
        - similarity_threshold
        - is_active
        - status
      properties:
        id:
          type: string
          format: uuid
        virtual_key:
          type: string
          example: "netra-sk-search-1a2b3c"
        team:
          type: string
          example: "Search Team"
        monthly_budget_usd:
          type: number
          format: double
          example: 100.0
        current_spend_usd:
          type: number
          format: double
          example: 14.25
        rpm_limit:
          type: integer
          example: 60
        tpm_limit:
          type: integer
          nullable: true
          example: 100000
        model_allowlist:
          type: array
          items:
            type: string
          example: ["fast", "smart", "auto"]
        semantic_cache_enabled:
          type: boolean
          example: true
        similarity_threshold:
          type: number
          format: double
          example: 0.92
        is_active:
          type: boolean
          example: true
        status:
          type: string
          enum: [ACTIVE, EXHAUSTED, REVOKED]
          example: "ACTIVE"
        created_at:
          type: string
          format: date-time

    CreateTenantRequest:
      type: object
      required:
        - team
      properties:
        virtual_key:
          type: string
          nullable: true
          example: "netra-sk-custom-key"
        team:
          type: string
          example: "Search Core"
        monthly_budget_usd:
          type: number
          format: double
          example: 100.0
        rpm_limit:
          type: integer
          example: 60
        tpm_limit:
          type: integer
          example: 100000
        model_allowlist:
          type: array
          items:
            type: string
          example: ["fast", "smart", "auto"]
        semantic_cache_enabled:
          type: boolean
          example: true
        similarity_threshold:
          type: number
          format: double
          example: 0.85

    UpdateTenantRequest:
      type: object
      properties:
        team:
          type: string
          example: "Search Core"
        monthly_budget_usd:
          type: number
          format: double
          example: 250.0
        rpm_limit:
          type: integer
          example: 120
        tpm_limit:
          type: integer
          example: 200000
        model_allowlist:
          type: array
          items:
            type: string
        semantic_cache_enabled:
          type: boolean
        similarity_threshold:
          type: number
          format: double
        is_active:
          type: boolean

    CurrencyRateResponse:
      type: object
      required:
        - base
        - target
        - rate
      properties:
        base:
          type: string
          example: "USD"
        target:
          type: string
          example: "INR"
        rate:
          type: number
          format: double
          example: 87.50

