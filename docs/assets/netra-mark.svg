<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="netra-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="netra-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="netra-iris-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <filter id="netra-filter-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="112" height="112" x="4" y="4" rx="28" fill="#0B0F19" stroke="url(#netra-grad-primary)" stroke-width="2"/>
  <rect width="104" height="104" x="8" y="8" rx="24" fill="url(#netra-grad-glow)"/>

  <!-- Orbital Cyber Rings -->
  <ellipse cx="60" cy="60" rx="42" ry="24" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4" transform="rotate(-15 60 60)"/>
  <ellipse cx="60" cy="60" rx="42" ry="24" stroke="#A855F7" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4" transform="rotate(25 60 60)"/>

  <!-- Netra Outer Eye Contour -->
  <path d="M18 60 C34 32, 86 32, 102 60 C86 88, 34 88, 18 60 Z" fill="none" stroke="url(#netra-grad-primary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#netra-filter-glow)"/>

  <!-- Inner Iris Aperture -->
  <circle cx="60" cy="60" r="18" fill="url(#netra-iris-glow)" stroke="#E0E7FF" stroke-width="2"/>

  <!-- Core Neural Spark -->
  <circle cx="60" cy="60" r="7" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="11" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Gateway Data Flow Nodes -->
  <circle cx="34" cy="45" r="2.5" fill="#38BDF8"/>
  <circle cx="86" cy="45" r="2.5" fill="#A855F7"/>
  <circle cx="34" cy="75" r="2.5" fill="#6366F1"/>
  <circle cx="86" cy="75" r="2.5" fill="#38BDF8"/>
</svg>
