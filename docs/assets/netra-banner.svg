<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Obsidian Canvas -->
  <rect width="1200" height="630" rx="16" fill="#06070A"/>
  
  <!-- Subtle Gradient Glow in Center -->
  <circle cx="600" cy="180" r="320" fill="#D2F823" fill-opacity="0.04" filter="blur(90px)"/>
  <circle cx="600" cy="360" r="280" fill="#38BDF8" fill-opacity="0.03" filter="blur(90px)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="629" rx="15.5" stroke="#18202F" stroke-width="1"/>

  <!-- Logo Emblem & Wordmark (Centered) -->
  <g transform="translate(450, 75)">
    <!-- Neon Squircle Emblem -->
    <rect width="60" height="60" rx="15" fill="#D2F823"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M30 13C20.6112 13 13 20.6112 13 30C13 39.3888 20.6112 47 30 47C39.3888 47 47 39.3888 47 30C47 20.6112 39.3888 13 30 13ZM20.5 30C20.5 24.7533 24.7533 20.5 30 20.5C35.2467 20.5 39.5 24.7533 39.5 30C39.5 35.2467 35.2467 39.5 30 39.5C24.7533 39.5 20.5 35.2467 20.5 30Z" fill="#06070A"/>
    <circle cx="30" cy="30" r="5.5" fill="#06070A"/>
    <path d="M41 19L45 15" stroke="#06070A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wordmark "netra" in lowercase geometric bold -->
    <text x="82" y="46" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="-2px">netra</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="180" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5px">The Unified Intelligent Interface for LLMs</text>
  
  <!-- Subtitle -->
  <text x="600" y="212" text-anchor="middle" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400">Route dynamically across frontier models, eliminate redundant token spend with sub-5ms caching, and ensure zero-downtime inference with one drop-in OpenAI-compatible API.</text>

  <!-- 4 Stat Metric Cards (OpenRouter-Aligned Aesthetic) -->
  <!-- Card 1 -->
  <g transform="translate(130, 260)">
    <rect width="215" height="104" rx="10" fill="#0A0D14" stroke="#18202F"/>
    <text x="20" y="42" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5px">ANY <tspan fill="#38BDF8" font-size="24">LLM</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">OPENAI-COMPATIBLE</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="11">one standard API for every provider</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(365, 260)">
    <rect width="215" height="104" rx="10" fill="#0A0D14" stroke="#18202F"/>
    <text x="20" y="42" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5px">0.00<tspan fill="#D2F823">%</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">OVER-ADMISSION</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="11">zero-leak rate &amp; budget limits</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(600, 260)">
    <rect width="215" height="104" rx="10" fill="#0A0D14" stroke="#18202F"/>
    <text x="20" y="42" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5px">&lt; 5<tspan fill="#10B981">ms</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">SEMANTIC CACHE</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="11">instant answers for repeated prompts</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(835, 260)">
    <rect width="215" height="104" rx="10" fill="#0A0D14" stroke="#18202F"/>
    <text x="20" y="42" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5px">72.4<tspan fill="#818CF8">%</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">COST ARBITRAGE</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="11">smart model routing by complexity</text>
  </g>

  <!-- Pill Links Bar (OpenRouter Style) -->
  <g transform="translate(195, 405)">
    <!-- Pill 1: Docs -->
    <rect x="0" y="0" width="275" height="38" rx="8" fill="#0A0D14" stroke="#18202F"/>
    <rect x="1" y="1" width="55" height="36" rx="7" fill="#141824"/>
    <text x="13" y="23" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.8px">DOCS</text>
    <text x="70" y="23" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">docs-netrallm.avadhanlabs.dev</text>

    <!-- Pill 2: API -->
    <rect x="290" y="0" width="215" height="38" rx="8" fill="#0A0D14" stroke="#18202F"/>
    <rect x="291" y="1" width="45" height="36" rx="7" fill="#141824"/>
    <text x="301" y="23" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.8px">API</text>
    <text x="350" y="23" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">/v1/chat/completions</text>

    <!-- Pill 3: Get API Key (Cyan Action Button) -->
    <rect x="520" y="0" width="130" height="38" rx="8" fill="#0284C7"/>
    <text x="585" y="23" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5px">GET API KEY</text>

    <!-- Pill 4: Open Playground (Neon Lime Action Button) -->
    <rect x="665" y="0" width="155" height="38" rx="8" fill="#D2F823"/>
    <text x="742" y="23" text-anchor="middle" fill="#06070A" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5px">OPEN PLAYGROUND</text>
  </g>

  <!-- Bottom Capability Micro-Labels -->
  <text x="600" y="525" text-anchor="middle" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2px">UNIFIED AI GATEWAY · SMART COMPLEXITY ROUTING · SEMANTIC VECTOR CACHE · ZERO OVER-ADMISSION</text>
</svg>
