<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="banner-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Outer Container -->
  <rect width="996" height="236" x="2" y="2" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid in Background -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.35">
    <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000"/>
    <path d="M100 0 V240 M200 0 V240 M300 0 V240 M400 0 V240 M500 0 V240 M600 0 V240 M700 0 V240 M800 0 V240 M900 0 V240"/>
  </g>

  <!-- Left Icon Mark -->
  <g transform="translate(60, 40)">
    <!-- Base Icon Shape -->
    <rect width="160" height="160" rx="36" fill="#0B0F19" stroke="url(#highlight-grad)" stroke-width="2.5"/>
    <rect width="152" height="152" x="4" y="4" rx="32" fill="#0284C7" fill-opacity="0.08"/>

    <!-- Orbital Cyber Rings -->
    <ellipse cx="80" cy="80" rx="60" ry="34" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5" transform="rotate(-15 80 80)"/>
    <ellipse cx="80" cy="80" rx="60" ry="34" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5" transform="rotate(25 80 80)"/>

    <!-- Eye Contour -->
    <path d="M24 80 C48 42, 112 42, 136 80 C112 118, 48 118, 24 80 Z" fill="none" stroke="url(#highlight-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#banner-glow)"/>

    <!-- Iris -->
    <circle cx="80" cy="80" r="25" fill="url(#banner-iris)" stroke="#E0E7FF" stroke-width="2.5"/>
    <!-- Pupil Core -->
    <circle cx="80" cy="80" r="10" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="15" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 4"/>
  </g>

  <!-- Typography Right Side (Clean, Sleek, Uncluttered) -->
  <g transform="translate(265, 0)">
    <!-- Brand Name -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="900" font-size="70" letter-spacing="10" fill="url(#highlight-grad)">NETRA</text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="500" font-size="22" fill="url(#text-grad)" letter-spacing="0.8">AI-First LLM Gateway &amp; Semantic Vector Cache</text>
  </g>
</svg>
