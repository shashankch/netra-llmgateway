<svg width="1080" height="520" viewBox="0 0 1080 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D2F823"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="520" rx="14" fill="#06070A"/>
  <rect x="0.5" y="0.5" width="1079" height="519" rx="13.5" stroke="#18202F" stroke-width="1"/>

  <!-- Diagram Title & Eyebrow -->
  <text x="40" y="44" fill="#94A3B8" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5px">SYSTEM ARCHITECTURE · INGRESS TO STORAGE</text>
  <text x="40" y="68" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5px">NETRA End-to-End Request Pipeline &amp; Data Plane</text>

  <!-- ==================== TIER 1: CLIENT INGRESS (LEFT) ==================== -->
  <rect x="40" y="100" width="200" height="380" rx="10" fill="#0A0D14" stroke="#18202F" stroke-dasharray="4,4"/>
  <rect x="52" y="94" width="110" height="14" rx="3" fill="#06070A"/>
  <text x="107" y="104" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1px">CLIENT CONSUMERS</text>

  <!-- Node 1.1: Applications / Agents -->
  <g transform="translate(55, 130)">
    <rect width="170" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="26" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="700">AI Agents &amp; Apps</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Bearer netra-sk-*</text>
    <text x="14" y="60" fill="#64748B" font-family="Inter, sans-serif" font-size="10">LangChain · OpenAI SDK</text>
  </g>

  <!-- Node 1.2: Ops Console UI -->
  <g transform="translate(55, 230)">
    <rect width="170" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="26" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="700">Ops Console &amp; UI</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">React 19 / Vite 6 (:3000)</text>
    <text x="14" y="60" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Analytics · Keys · SSE Logs</text>
  </g>

  <!-- Node 1.3: Verification CLI -->
  <g transform="translate(55, 330)">
    <rect width="170" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="26" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="700">Automation CLI</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Makefile · Python Drills</text>
    <text x="14" y="60" fill="#64748B" font-family="Inter, sans-serif" font-size="10">smoke · load · routing-eval</text>
  </g>


  <!-- ==================== TIER 2: NETRA GATEWAY CORE (CENTER) ==================== -->
  <rect x="280" y="100" width="460" height="380" rx="10" fill="#0A0D14" stroke="#0284C7" stroke-opacity="0.3"/>
  <rect x="296" y="94" width="180" height="14" rx="3" fill="#06070A"/>
  <text x="386" y="104" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1px">NETRA ENTERPRISE GATEWAY (IN-VPC)</text>

  <!-- Node 2.1: Ingress & Atomic Rate Limiter -->
  <g transform="translate(300, 130)">
    <rect width="200" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Ingress &amp; Rate Limiter</text>
    <text x="14" y="42" fill="#D2F823" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">0.00% Over-Admission</text>
    <text x="14" y="58" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">IETF RateLimit · Redis Lua ZSET</text>
  </g>

  <!-- Node 2.2: Two-Tier Semantic Vector Cache (FOCAL NODE) -->
  <g transform="translate(525, 130)">
    <rect width="195" height="74" rx="8" fill="#0D111A" stroke="#D2F823" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#D2F823" font-family="Inter, sans-serif" font-size="12" font-weight="800">Two-Tier Vector Cache</text>
    <text x="14" y="42" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Tier 1 &lt;0.5ms · Tier 2 &lt;5ms</text>
    <text x="14" y="58" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Exact Hash L1 + pgvector HNSW</text>
  </g>

  <!-- Node 2.3: Syntactic Complexity Auto-Router -->
  <g transform="translate(300, 230)">
    <rect width="200" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Dynamic Model Router</text>
    <text x="14" y="42" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">auto -> fast vs. smart</text>
    <text x="14" y="58" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Syntactic Classifier (~72% Save)</text>
  </g>

  <!-- Node 2.4: Unbuffered Streaming SSE Relay -->
  <g transform="translate(525, 230)">
    <rect width="195" height="74" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Unbuffered SSE Relay</text>
    <text x="14" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">~20ms TTFT · Socket Abort</text>
    <text x="14" y="58" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Java 25 Virtual Threads</text>
  </g>

  <!-- Node 2.5: Micro-Cost Telemetry Ledger -->
  <g transform="translate(300, 330)">
    <rect width="420" height="64" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="16" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Telemetry &amp; Micro-Cost Settlement</text>
    <text x="16" y="44" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">BigDecimal 6-decimal ($0.000000) · x-netra-* headers · Live Forex (USD/INR)</text>
  </g>


  <!-- ==================== TIER 3: UPSTREAM INFERENCE (RIGHT) ==================== -->
  <rect x="780" y="100" width="260" height="240" rx="10" fill="#0A0D14" stroke="#18202F" stroke-dasharray="4,4"/>
  <rect x="796" y="94" width="130" height="14" rx="3" fill="#06070A"/>
  <text x="861" y="104" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1px">UPSTREAM AI PROVIDERS</text>

  <!-- Upstream 1: Frontier & Open-Weights (OpenRouter / Cloud) -->
  <g transform="translate(800, 130)">
    <rect width="220" height="60" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">OpenRouter &amp; Cloud Labs</text>
    <text x="14" y="42" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">openai/gpt-4o · claude-3-5 · gemini</text>
  </g>

  <!-- Upstream 2: Local & Self-Hosted (Mocks / vLLM) -->
  <g transform="translate(800, 210)">
    <rect width="220" height="60" rx="8" fill="#0D111A" stroke="#253046" filter="url(#shadow)"/>
    <text x="14" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Mocks &amp; Self-Hosted vLLM</text>
    <text x="14" y="42" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">alpha (:9001) &amp; beta (:9002)</text>
  </g>


  <!-- ==================== TIER 4: STORAGE & PERSISTENCE (BOTTOM RIGHT) ==================== -->
  <rect x="780" y="360" width="260" height="120" rx="10" fill="#0A0D14" stroke="#18202F"/>
  <rect x="796" y="354" width="120" height="14" rx="3" fill="#06070A"/>
  <text x="856" y="364" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1px">STORAGE &amp; STATE</text>

  <g transform="translate(800, 385)">
    <rect width="220" height="38" rx="6" fill="#0D111A" stroke="#253046"/>
    <text x="14" y="23" fill="#DC382D" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Redis 8.0</text>
    <text x="85" y="23" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Sliding RPM &amp; Spend ZSET</text>
  </g>

  <g transform="translate(800, 430)">
    <rect width="220" height="38" rx="6" fill="#0D111A" stroke="#253046"/>
    <text x="14" y="23" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PostgreSQL 18</text>
    <text x="105" y="23" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">pgvector HNSW + Logs</text>
  </g>


  <!-- ==================== CONNECTORS & DATA FLOW ==================== -->
  <!-- Client to Gateway Ingress -->
  <path d="M 225 167 H 295" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 225 267 H 260 V 177 H 295" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Ingress to Cache -->
  <path d="M 500 167 H 520" stroke="#D2F823" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Cache Miss to Router -->
  <path d="M 622 204 V 218 H 400 V 225" stroke="#64748B" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <!-- Router to Upstream -->
  <path d="M 500 267 H 520" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 720 267 H 755 V 160 H 795" stroke="#38BDF8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M 755 240 H 795" stroke="#38BDF8" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- Gateway to Storage -->
  <path d="M 720 362 H 755 V 404 H 795" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 755 404 V 449 H 795" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>

</svg>
