# Fly.io Edge Configuration for NETRA Gateway (2026 Edition)
app = "netra-llm-gateway"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  soft_limit = 1000
  hard_limit = 2500

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
