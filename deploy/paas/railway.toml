# Railway Deployment Template for NETRA Gateway
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "java -XX:+UseZGC -XX:+EnableDynamicAgentLoading -jar app.jar"
healthcheckPath = "/health"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
