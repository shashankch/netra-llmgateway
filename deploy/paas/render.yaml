# Render Blueprint Specification for NETRA LLM Gateway (2026 Edition)
# Reference: https://render.com/docs/blueprint-spec
version: "1"

services:
  # 1. NETRA Gateway Core Service
  - type: web
    name: netra-gateway
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: NETRA_ADMIN_TOKEN
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: netra-postgres
          property: connectionString
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: netra-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: netra-redis
          property: port

  # 2. Managed Redis / Key-Value Instance
  - type: keyvalue
    name: netra-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database with pgvector
  - name: netra-postgres
    databaseName: netra
    user: netra
    plan: starter
    postgresMajorVersion: "16"
