    <rect width="238" height="104" rx="8" fill="#0D111A" stroke="#18202F" stroke-width="1"/>
    <text x="20" y="42" fill="#F8FAFC" font-family="'JetBrains Mono', 'SF Mono', monospace, Inter" font-size="28" font-weight="900" letter-spacing="-1px">72.4<tspan fill="#818CF8">%</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1px">COST ARBITRAGE</text>
