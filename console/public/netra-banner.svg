    <text x="20" y="42" fill="#F8FAFC" font-family="'JetBrains Mono', 'SF Mono', monospace, Inter" font-size="28" font-weight="900" letter-spacing="-1px">&lt; 5<tspan fill="#10B981">ms</tspan></text>
    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1px">SEMANTIC CACHE</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11">instant answers for repeated prompts</text>
