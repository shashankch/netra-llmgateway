    <text x="20" y="66" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1px">OPENAI-COMPATIBLE</text>
    <text x="20" y="85" fill="#64748B" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11">one standard API for every provider</text>
