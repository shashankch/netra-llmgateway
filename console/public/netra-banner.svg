  <!-- Primary Tagline -->
  <text x="600" y="162" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5px">The Unified Intelligent Interface for LLMs</text>
  
  <!-- Subtitle -->
  <text x="600" y="194" text-anchor="middle" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="400">Route dynamically across frontier models, eliminate redundant token spend with sub-5ms caching, and ensure zero-downtime inference with one drop-in OpenAI-compatible API.</text>

