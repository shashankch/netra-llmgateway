<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions & Gradients -->
  <defs>
    <filter id="glow-lime" x="200" y="-120" width="800" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="80" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="glow-cyan" x="250" y="100" width="700" height="550" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="80" result="effect1_foregroundBlur"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas with 16px Rounded Window Border -->
  <rect width="1200" height="630" rx="16" fill="#0A0D14"/>
  
  <!-- Subtle Ambient Glows -->
  <circle cx="600" cy="180" r="280" fill="#D2F823" fill-opacity="0.035" filter="url(#glow-lime)"/>
  <circle cx="600" cy="370" r="240" fill="#38BDF8" fill-opacity="0.03" filter="url(#glow-cyan)"/>

  <!-- Outer Window Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="628.5" rx="15.25" stroke="#18202F" stroke-width="1.5"/>

  <!-- ========================================================================
       TOP WINDOW BAR (Matching Ops Console LandingHero Tab Bar)
       ======================================================================== -->
  <path d="M1 16C1 7.71573 7.71573 1 16 1H1184C1192.28 1 1199 7.71573 1199 16V44H1V16Z" fill="#0D111A"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#18202F" stroke-width="1"/>

  <!-- Left: Live Status Indicator & Console Identifier -->
  <circle cx="28" cy="22.5" r="4" fill="#D2F823"/>
  <circle cx="28" cy="22.5" r="7" fill="#D2F823" fill-opacity="0.2"/>
  <text x="42" y="26.5" fill="#94A3B8" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.2px">NETRA ENTERPRISE GATEWAY</text>

  <!-- Right: Ops Status Badge (SANDBOX · ONLINE) -->
  <rect x="1038" y="11" width="134" height="23" rx="11.5" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1"/>
  <text x="1105" y="26.5" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.6px">SANDBOX · ONLINE</text>

  <!-- ========================================================================
       HERO CENTERPIECE: Logo & Wordmark
       ======================================================================== -->
  <g transform="translate(502, 72)">
    <!-- Brand Squircle Aperture Emblem -->
    <rect width="52" height="52" rx="13" fill="#D2F823"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M26 11C17.7157 11 11 17.7157 11 26C11 34.2843 17.7157 41 26 41C34.2843 41 41 34.2843 41 26C41 17.7157 34.2843 11 26 11ZM18 26C18 21.5817 21.5817 18 26 18C30.4183 18 34 21.5817 34 26C34 30.4183 30.4183 34 26 34C21.5817 34 18 30.4183 18 26Z" fill="#06070A"/>
    <circle cx="26" cy="26" r="4.8" fill="#06070A"/>
    <path d="M35.5 16.5L39 13" stroke="#06070A" stroke-width="2.5" stroke-linecap="round"/>

