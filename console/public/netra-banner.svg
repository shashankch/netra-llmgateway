    <g transform="translate(685, 220)" stroke="#D2F823" stroke-width="1.4" fill="#D2F823" fill-opacity="0.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 1.5l1.1 3.4a1.2 1.2 0 0 0 .7.7L12.5 7l-3.4 1.1a1.2 1.2 0 0 0-.7.7L7 12.5l-1.1-3.4a1.2 1.2 0 0 0-.7-.7L1.5 7l3.4-1.1a1.2 1.2 0 0 0 .7-.7L7 1.5z"/>
    </g>
