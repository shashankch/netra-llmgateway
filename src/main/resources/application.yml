# ==============================================================================
# NETRA LLM Gateway — Base Configuration (Shared across all profiles)
# Active Profile: Defaults to 'dev' for offline verification drills & local dev.
# Set SPRING_PROFILES_ACTIVE=prod in production (OCI, AWS, PaaS, Kubernetes).
# ==============================================================================
spring:
  application:
    name: netra-llm-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netra}
    username: ${SPRING_DATASOURCE_USERNAME:netra}
    password: ${SPRING_DATASOURCE_PASSWORD:netra}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

netra:
  data-path: ${NETRA_DATA_PATH:data}
  admin-token: ${NETRA_ADMIN_TOKEN:netra-admin-demo}
  seed-demo-tenants: ${NETRA_SEED_DEMO_TENANTS:true}
  currency:
    fallback-usd-to-inr: ${NETRA_CURRENCY_FALLBACK_USD_TO_INR:85.00}
    cache-ttl-hours: ${NETRA_CURRENCY_CACHE_TTL_HOURS:6}
  retry:
    max-attempts: ${NETRA_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${NETRA_RETRY_INITIAL_BACKOFF_MS:200}
    backoff-multiplier: ${NETRA_RETRY_BACKOFF_MULTIPLIER:2.0}
    max-chain-timeout-ms: ${NETRA_RETRY_MAX_CHAIN_TIMEOUT_MS:15000}
  degradation:
    error-rate-threshold: 0.5
    window-seconds: 60
    p95-latency-ms: 5000
