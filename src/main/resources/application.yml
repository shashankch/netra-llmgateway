spring:
  application:
    name: netra-llm-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netra}
    username: ${SPRING_DATASOURCE_USERNAME:netra}
    password: ${SPRING_DATASOURCE_PASSWORD:netra}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

netra:
  data-path: ${NETRA_DATA_PATH:data}
  currency:
    fallback-usd-to-inr: 87.50
    cache-ttl-hours: 6
  providers:
    - name: alpha
      base-url: ${ALPHA_PROVIDER_URL:http://localhost:9001/v1}
      api-key: mock-key-alpha
    - name: beta
      base-url: ${BETA_PROVIDER_URL:http://localhost:9002/v1}
      api-key: mock-key-beta
  model-aliases:
    fast:
      primary: alpha-small
      fallbacks:
        - beta-small
    smart:
      primary: alpha-large
      fallbacks:
        - beta-large
    auto:
      route-by-difficulty:
        simple: fast
        complex: smart
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    backoff-multiplier: 2
  degradation:
    error-rate-threshold: 0.5
    window-seconds: 60
    p95-latency-ms: 5000
