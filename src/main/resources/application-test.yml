# ==============================================================================
# NETRA LLM Gateway — Sliced & Integration Test Profile (test)
# ==============================================================================
netra:
  retry:
    max-attempts: 3
    initial-backoff-ms: 10
    backoff-multiplier: 1.5
  providers:
    - name: alpha
      base-url: http://localhost:9001
      api-key: mock-key-alpha
    - name: beta
      base-url: http://localhost:9002
      api-key: mock-key-beta
  model-aliases:
    fast:
      primary: alpha-small
      fallbacks:
        - beta-small
    smart:
      primary: alpha-large
      fallbacks:
        - beta-large
    auto:
      route-by-difficulty:
        simple: fast
        complex: smart
