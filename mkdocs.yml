site_name: NETRA Documentation
site_description: Production-Grade AI-First LLM Gateway & Semantic Vector Cache
site_author: Shashank Chandel
site_url: https://shashankch.github.io/netra-llmgateway/

repo_name: shashankch/netra-llmgateway
repo_url: https://github.com/shashankch/netra-llmgateway

extra:
  version: "0.5.0"

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list

nav:
  - Overview: index.md
  - API Reference: api-reference.md
  - Architecture & Design:
      - System Overview: index.md
      - Architectural Decisions (ADR): ADR.md
      - Conventions: CONVENTIONS.md
  - Operations & Deployment:
      - Self-Hosting Guide: SELF-HOSTING.md
      - Roadmap: ROADMAP.md
  - Community:
      - Security Policy: SECURITY.md
      - Contributing: CONTRIBUTING.md
