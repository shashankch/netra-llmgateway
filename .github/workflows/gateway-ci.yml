name: Gateway CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Application
        run: ./gradlew build -x test

      # Runs unit/contract tests plus live PostgreSQL 18 (pgvector) and Redis 8.0 Testcontainers suite
      - name: Run Unit & Live Container Integration Tests
        run: ./gradlew test

      - name: Validate Pack Integrity
        run: |
          python3 scripts/validate_pack.py
