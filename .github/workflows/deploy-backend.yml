name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force run build, test, and deploy even if no new release was detected'
        required: false
        type: boolean
        default: true
      target_tag:
        description: 'Target release tag (e.g. netra-llmgateway-v0.7.5, leave empty to auto-detect)'
        required: false
        type: string
        default: ''

concurrency:
  group: "deploy-backend"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Run Release Please & Detect Releases
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' || steps.check-existing.outputs.release_detected == 'true' || inputs.force_deploy == true || github.event_name == 'workflow_dispatch' }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.check-existing.outputs.tag_name || inputs.target_tag || '' }}
      version: ${{ steps.release.outputs.version || steps.check-existing.outputs.version || '' }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Code For Release Detection
        if: ${{ steps.release.outputs.release_created != 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 10

      - name: Check Existing Release on Re-run
        id: check-existing
        if: ${{ steps.release.outputs.release_created != 'true' }}
        run: |
          git fetch --tags origin || true
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || true)
          TAG_ON_HEAD=$(git tag --points-at HEAD 2>/dev/null | grep -E '^netra-llmgateway-v' | head -n 1 || true)
          if [ -n "$TAG_ON_HEAD" ]; then
            VERSION=${TAG_ON_HEAD#netra-llmgateway-v}
            echo "Detected release tag on HEAD: $TAG_ON_HEAD (version $VERSION)"
            echo "release_detected=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_ON_HEAD" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMIT_MSG" =~ chore\(main\):\ release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG="netra-llmgateway-v${VERSION}"
            echo "Detected release commit on HEAD: $COMMIT_MSG (version $VERSION, tag $TAG)"
            echo "release_detected=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release commit or tag detected on HEAD."
            echo "release_detected=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: netra
          POSTGRES_USER: netra
          POSTGRES_PASSWORD: netra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  build-and-push:
    name: Build & Publish Image
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netra-gateway
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.version != '' }}
            type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.tag_name != '' }}
            type=semver,pattern={{version}},prefix=netra-llmgateway-v,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.tag_name != '' }}
            type=semver,pattern={{major}}.{{minor}},prefix=netra-llmgateway-v,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.tag_name != '' }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy to Production Host
    needs: [release-please, build-and-push]
    runs-on: ubuntu-latest
    if: ${{ (needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true) && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check Host Deployment Secrets
        id: check-secrets
        run: |
          DEPLOY_TARGET_HOST="${{ secrets.DEPLOY_HOST || secrets.OCI_HOST }}"
          DEPLOY_TARGET_KEY="${{ secrets.DEPLOY_SSH_KEY || secrets.OCI_SSH_KEY }}"
          if [ -n "$DEPLOY_TARGET_HOST" ] && [ -n "$DEPLOY_TARGET_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Host deployment secrets (DEPLOY_HOST/OCI_HOST, DEPLOY_SSH_KEY/OCI_SSH_KEY) not configured. Skipping automated SSH deploy step."
          fi

      - name: Deploy Container via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.OCI_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME || secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.OCI_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_APP_DIR || secrets.OCI_APP_DIR || '$HOME/netra-llmgateway' }}"
            cd "$APP_DIR" || cd "/opt/netra-llmgateway"
            echo "==> Pulling latest repository state..."
            git pull origin main
            echo "==> Pulling updated multi-arch gateway image..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull gateway
            echo "==> Seamless zero-downtime rollover (backing PostgreSQL & Redis remain untouched)..."
            docker compose up -d --no-deps gateway
            echo "==> Running readiness verification drill..."
            for i in {1..30}; do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "==> NETRA Gateway is healthy and live!"
                exit 0
              fi
              echo "Waiting for gateway readiness probe... ($i/30)"
              sleep 2
            done
            echo "Error: Gateway health check timed out!"
            docker compose logs --tail=50 gateway
            exit 1
