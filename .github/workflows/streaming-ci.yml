name: NETRA Streaming SSE CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  streaming-benchmark:
    name: Streaming SSE Verification (Java 25 LTS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: netra
          POSTGRES_USER: netra
          POSTGRES_PASSWORD: netra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Streaming Relay Tests
        run: ./gradlew test --tests com.netra.gateway.StreamingRelayServiceTest

      - name: Start Mock Providers in Background
        run: |
          python3 scripts/mock_provider.py --port 9001 --name alpha &
          python3 scripts/mock_provider.py --port 9002 --name beta &
          sleep 2
          curl -s http://localhost:9001/health
          curl -s http://localhost:9002/health
