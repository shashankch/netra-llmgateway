name: "Bug Report"
description: "File a bug or report unexpected behavior in NETRA LLM Gateway or Operations Console"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can diagnose and resolve it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of NETRA LLM Gateway is affected?
      options:
        - "Operations Console (Web UI)"
        - "Gateway Core & Data Plane (/v1/chat/completions)"
        - "Admin Control Plane (/admin/*)"
        - "Semantic Cache & Vector Engine"
        - "Rate Limiting & Token Budgeting"
        - "CI/CD & Cloud Deployment"
        - "Documentation & Examples"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Observe error '....'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & Diagnostic Traces
      description: Relevant console logs, gateway terminal output, or HTTP response payloads.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment & Versions
      description: NETRA Gateway version, Browser/OS, deployment mode (Docker Compose, VPS, Vercel).
      placeholder: "v0.7.5, Chrome 130 on macOS / Ubuntu 24.04 VPS"
    validations:
      required: false
